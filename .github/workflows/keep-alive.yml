# Render's free plan puts the backend to sleep after ~15 minutes without traffic, and the next
# visit then waits about a minute. Ping the prod health check during the hours the app is used.
# Only 6:00-22:59 Vietnam time: staying awake 24/7 would use ~744 of the 750 free instance hours
# per month that prod and test share, and going over suspends both until the month ends.
name: Giữ server luôn thức

on:
  schedule:
    # GitHub cron is UTC: 23:00-15:59 UTC = 6:00-22:59 Asia/Ho_Chi_Minh. Every 5 minutes because
    # scheduled runs are often delayed by several minutes.
    - cron: "*/5 23 * * *"
    - cron: "*/5 0-15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gọi /api/health
        run: curl -fsS --max-time 120 --retry 2 --retry-delay 10 -o /dev/null -w "HTTP %{http_code} trong %{time_total}s\n" https://van-chemistry.vercel.app/api/health
